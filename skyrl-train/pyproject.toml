[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skyrl-train"
version = "0.3.0"
description = "skyrl-train"
authors = [
    {name = "NovaSkyAI", email = "novasky.berkeley@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = "==3.12.*"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "loguru",
    "tqdm",
    "ninja",
    "tensorboard",
    "func_timeout",
    # transformers 5.8.x: required by the modern Megatron backend (megatron-bridge 0.5.0 pins
    # transformers>=5.8.1,<5.9.0), and co-resolvable with the whole stack — vLLM 0.20.2 allows it
    # (its constraint excludes only 5.0-5.5: `!=5.0.*..!=5.5.0,>=4.56.0`), and peft floats to 0.19.x
    # (transformers-unpinned). Our import surface is unchanged 4.57->5.8 (the trainer already targets
    # the 4.56/4.57 tail that adopted the 5.x-style API — AttentionInterface, masking_utils, the
    # per-model modeling refactors); every audited import site resolves against 5.8.1. Pinned to one
    # 5.8.x line so the fsdp2 and megatron backends train under an identical transformers.
    "transformers>=5.8.1,<5.9",
    "hydra-core==1.3.2",
    "accelerate",
    # Floor of 2.10 carries the torch-native context-parallel API
    # (torch.distributed.tensor.experimental.context_parallel + the ring-SDPA load balancer) that
    # the trainer needs. Production runs 2.11.0+cu130, which is what every extra now resolves to.
    "torch>=2.10.0",
    "torchdata",
    "omegaconf",
    "ray==2.51.1",
    # peft 0.17 cannot import under transformers 5 (`ImportError: cannot import name 'HybridCache'`),
    # and peft is a top-level import (model_wrapper.py, fsdp_utils.py). 0.19 is the first line that
    # imports cleanly under transformers 5.8; also satisfies megatron-bridge 0.5.0's peft>=0.18.1.
    "peft>=0.19",
    "debugpy==1.8.0",
    "hf_transfer",
    "wandb",
    "datasets>=4.0.0",
    "tensordict",
    "jaxtyping",
    "skyrl-gym",
    "flash-attn",
    "polars",
    "s3fs",
    "fastapi",
    "uvicorn",
]

[tool.uv]
required-version = ">=0.8.10"

# Megatron CUDA build deps import the ambient torch at build time, so they cannot build under
# PEP-517 isolation. Only relevant on a from-source fallback (the lock resolves them from the
# prebuilt wheels in [tool.uv.sources]); belt-and-suspenders for the kaniko H100 build.
no-build-isolation-package = [
    "transformer-engine",
    "transformer-engine-torch",
]

# Megatron transitive pins that fight this tree's stack (scoped so the base/fsdp2 resolution is
# untouched):
#  - the transformer-engine meta package hardcodes the cu13 CUDA core; this image is CUDA 12.8, so
#    drop cu13 (transformer-engine-cu12 is added to the megatron extra instead).
#  - nvidia-resiliency-ext is an unpinned megatron-bridge transitive we do not use (sdist, CUDA).
override-dependencies = [
    "transformer-engine-cu13 ; sys_platform == 'never'",
    "nvidia-resiliency-ext ; sys_platform == 'never'",
]

# flash-attn has no prebuilt wheel for this torch/CUDA line (2.11 + cu13): Dao-AILab publishes
# classic flash-attn wheels only up to cu12/torch2.8, so uv builds it from the sdist. That build
# needs torch present (match-runtime supplies it), and compiling the CUDA kernels would take tens of
# minutes and an nvcc toolchain the CPU CI runners do not have -- so SKIP_CUDA_BUILD installs the
# Python package without its kernels. That is enough for the CPU suites, where every flash-attn
# import is guarded or `pytest.importorskip`-ed. It is NOT enough to actually run attention: the
# resulting package imports its Python layer but fails at `import flash_attn_2_cuda`. Anything that
# needs real flash attention on this line builds the kernels out of band (the production SIF does).
# The nightly GPU run installs the environment *without* flash-attn and uses native attention
# instead (see ci/marin_nightly/run_h100.sh) -- a genuine absence is safe where this stub is not.
[tool.uv.extra-build-dependencies]
flash-attn = [{requirement = "torch", match-runtime = true}]
# TransformerEngine's sdist builds its CUDA extension against the ambient torch (with build_tools +
# ninja). Only exercised on a from-source fallback; the lock uses the prebuilt wheels below.
transformer-engine = [{requirement = "torch", match-runtime = true}, "build_tools", "ninja"]
transformer-engine-torch = [{requirement = "torch", match-runtime = true}, "build_tools", "ninja"]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE"}

# flash-attn ships no static metadata: its sdist computes requires-dist at build time, and
# building it needs torch, which is the very thing `match-runtime` is trying to resolve. That
# circularity makes `uv lock` fail outright, which is why this lockfile had gone stale (it still
# pinned torch 2.8 against a tree that requires >=2.10). Declaring the metadata here is uv's
# supported way out: resolution reads these requirements instead of building the sdist, and the
# build itself is unaffected. Values are flash-attn's own install_requires.
[[tool.uv.dependency-metadata]]
name = "flash-attn"
requires-dist = ["torch", "einops"]

[tool.uv.sources]
skyrl-gym = { path = "./skyrl-gym" , editable = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
# We use `flashinfer-jit-cache` to avoid slow JIT compilation on first run.
flashinfer-jit-cache = { index = "flashinfer-cu130", marker = "extra == 'vllm'" }
# Expert-parallel / router-replay port (see notes/skyrl/fsdp2_ep_router_replay_port_plan.md).
# torchtitan is pure-python (provides @expert_parallel / ExpertParallel); it does NOT rebuild
# torch. Pin matches prime-rl (EP + grouped-GEMM + R3 validated there); compatible with our
# trainer torch 2.9.0 — Stage-0 dry-run confirmed it moves no protected package (torch/TE/
# transformers/numpy/flash-attn/mcore).
torchtitan = { git = "https://github.com/pytorch/torchtitan", rev = "a1fdd7e" }
# deep-ep is the Stage-5 perf backend only. The prime-rl prebuilt wheel is x86_64; on aarch64
# (Jupiter/GH200) an aarch64-native build already exists in envs/rl, supplied out-of-band, so
# the URL below is inert there (gated by the marker on the `deepep` extra). x86_64-only.
deep-ep = { url = "https://github.com/PrimeIntellect-ai/prime-rl/releases/download/v0.5.0/deep_ep-1.2.1+29d31c0-cp312-cp312-linux_x86_64.whl" }
# Megatron backend (see the `megatron` extra). These three are sdist-only on PyPI and build CUDA
# extensions against torch at install time (uv can't resolve their metadata on a non-CUDA host), so
# they resolve from prebuilt torch-2.11 / cu128 / cp312 / x86_64 wheels — the erictang000 forks
# upstream SkyRL's megatron extra also uses, matching the gpu-rl image ABI. x86_64-only (H100).
transformer-engine-torch = { url = "https://github.com/erictang000/TransformerEngine/releases/download/v2.11.0-torch2.11/transformer_engine_torch-2.11.0-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and python_version == '3.12' and platform_machine == 'x86_64'" }
causal-conv1d = { url = "https://github.com/erictang000/causal-conv1d/releases/download/v1.6.1.post4-torch2.11/causal_conv1d-1.6.1-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and python_version == '3.12' and platform_machine == 'x86_64'" }
mamba-ssm = { url = "https://github.com/erictang000/mamba/releases/download/v2.3.1-torch2.11/mamba_ssm-2.3.1-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and python_version == '3.12' and platform_machine == 'x86_64'" }

# Inference extra: vllm. The `megatron` extra (below) adds the Megatron training backend. Two other
# extras (sglang, flashrl) used to sit here and could not be installed: sglang 0.5.13 pins a
# flashinfer line the vllm extra excludes, and flashrl pinned torch==2.7.0 and is dead upstream
# (NovaSky-AI/SkyRL#1338). Megatron was likewise dropped as unsolvable while the tree was on
# transformers 4.x; it is reinstated here now that the tree is on transformers 5.8.
[project.optional-dependencies]
deepspeed = [
    "deepspeed==0.17.6"
]
dev = [
    "ruff==0.11.9",
    "black==24.10.0",
    "pytest>=6.2.5",
    "pytest-asyncio",
    "pre-commit",
    "litellm",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=1.25.0",
    "myst-parser>=2.0.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-autobuild>=2021.3.14"
]
# TODO(tgriggs): Add `sandboxes` here once available as a package.
sandboxes = [
    "litellm[proxy]>=1.67.5",
]
# Stage-1 (FSDP2 CP port): the vllm extra is the actively-used inference path; its torch
# pin must carry torch-native context_parallel (>=2.10). Versions MIRROR the production SIF
# `skyrl_megatron_vllm0202rc0_r3.sif`, which runs the following resolved stack multi-node on
# Jupiter today: torch 2.11.0, vLLM 0.20.2rc0, flash-attn 2.6.3, torchvision 0.26.0.
# Torch comes from the cu130 index, matching that SIF. CUDA 13 wheels need an NVIDIA driver
# >= 580; the trainer already assumes this line (see distributed/utils.py, which parses
# "2.11.0+cu130").
# flash-attn is only needed for the NON-CP paths after Stage 2 (CP uses SDPA), so a slightly
# older 2.6.3 paired with torch 2.11 is fine.
vllm = [
    "vllm==0.20.2",
    "flash-attn==2.6.3",
    "torch==2.11.0",
    # vllm 0.20.2 hard-pins flashinfer-python==0.6.8.post1, and flashinfer raises at import if the
    # jit-cache it finds is a different version -- so the jit-cache must be pinned to the same version,
    # not left to float to the newest on the cu130 index (0.6.14), which is what broke the GPU run.
    # Both are pinned explicitly so a future vllm bump fails at `uv lock` rather than silently on GPU.
    "flashinfer-python==0.6.8.post1",
    "flashinfer-jit-cache==0.6.8.post1",
    "torchvision==0.26.0"
]
miniswe = [
    # NOTE (sumanthrh): Needs to be a commit after https://github.com/SWE-agent/mini-swe-agent/commit/4f5d445e99d13b5482478c23508bf2fbf7c0670c
    "mini-swe-agent>=1.12.0",
    "litellm",
]
# Expert-parallel / router-replay port (Stage 0+). See notes/skyrl/fsdp2_ep_router_replay_port_plan.md.
# `ep` = the Stage-4 torch-backend EP floor (torchtitan only; no NVSHMEM, no deep-ep coupling).
# `deepep` = the Stage-5 perf backend (adds the platform-gated deep-ep wheel; inert on aarch64).
# Neither pins torch/vllm, so they are NOT added to [tool.uv].conflicts; the base install is
# unaffected and the no-EP default path needs neither extra.
ep = [
    "torchtitan",
]
deepep = [
    "torchtitan",
    "deep-ep ; platform_machine == 'x86_64'",
]

# Megatron training backend — the alternative to the default FSDP2 policy trainer, for the
# Megatron-vs-FSDP2 comparison (skyrl_train/workers/megatron, built on megatron.bridge.AutoBridge).
# Isolated in its own extra so the default (fsdp2) install and CPU CI are unaffected; every dep is
# gated to linux/x86_64 (the CoreWeave H100 gpu-rl runtime), so the lock captures it there and it
# never builds on the Mac / aarch64.
#
# This is the MODERN Megatron line: megatron-bridge 0.5.0 (the latest release) + megatron-core
# 0.18.1. It requires transformers>=5.8.1 (why the base pin moved to 5.8.x) and torch>=2.6 (no
# ceiling), so torch stays on the base/vllm 2.11 line. flashinfer is consistent across the whole
# stack at 0.6.8.post1 (megatron-bridge pins it exactly, megatron-core[dev] accepts <0.7,>=0.5, the
# vllm extra pins it) so NO flashinfer override is needed. vLLM is deliberately not re-pinned here
# (generation uses the base `vllm` extra / the from-source fork build in the gpu-rl image).
#
# transformer-engine-torch / mamba-ssm / causal-conv1d are sdist-only on PyPI and build CUDA
# extensions against torch, so they resolve from prebuilt torch-2.11 / cu128 / cp312 / x86_64 wheels
# (erictang000 forks — the same wheels upstream SkyRL's megatron extra uses; see [tool.uv.sources]).
# TransformerEngine's CUDA core is the cu13 default; overridden to -cu12 to match the cu128 runtime
# (see [tool.uv] override-dependencies). mamba-ssm/causal-conv1d are added explicitly (megatron-bridge
# 0.5.0 no longer pulls them) for the GDN / Mamba-hybrid models (Qwen3-Next, Qwen3.6-35B-A3B).
megatron = [
    "megatron-bridge==0.5.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "megatron-core==0.18.1 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "transformer-engine[pytorch]==2.11.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # Declared directly (not just via transformer-engine[pytorch]) so the [tool.uv.sources] URL is
    # honored — uv ignores sources for transitive-only packages.
    "transformer-engine-torch==2.11.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # cu12 CUDA core to match the cu128 runtime (cu13 core overridden to `never`).
    "transformer-engine-cu12==2.11.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # GDN / Mamba-hybrid kernels (Qwen3-Next, Qwen3.6-35B-A3B) under megatron.
    "mamba-ssm>=2.2,<3 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "causal-conv1d>=1.5,<2 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "flash-linear-attention ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-modelopt ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]


[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "flashinfer-cu130"
url = "https://flashinfer.ai/whl/cu130"
explicit = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["skyrl_train*"]

[tool.setuptools.dynamic]
version = {attr = "skyrl_train.__version__"}
readme = {file = ["README.md"]}

# Ship default config files in the wheel
[tool.setuptools.package-data]
"skyrl_train" = ["config/**"]

[tool.pytest.ini_options]
addopts = "-v -s"
testpaths = [
    "tests",
]



[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "F722", # Syntax error in annotation - ignored because this doesn't play well with jaxtyping
    "E741", # Ambiguous variable names (l, I) - carried over from the flake8 config this replaces
]

[tool.ruff.lint.per-file-ignores]
# These modules put the repo root on sys.path so that `tests.*` resolves under a bare
# `python tests/gpu/...` invocation, so their imports necessarily follow that statement.
"tests/gpu/test_e2e_moe_rl_step.py" = ["E402"]
"tests/gpu/test_e2e_moe_rl_step_80b.py" = ["E402"]
# A skip guarding an optional dependency has to run before the import it guards.
"tests/cpu/distributed/test_muon_hybrid.py" = ["E402"]
"tests/cpu/generators/test_normalize_prompt_token_ids.py" = ["E402"]
"tests/cpu/models/test_moe_weight_remap.py" = ["E402"]
"tests/cpu/models/test_models.py" = ["E402"]
# Optional-dependency shim: the imports inside the try block are the availability probe.
"examples/terminal_bench/_harbor_compat.py" = ["F401"]

[pytest]
markers = [
    "vllm",
    "sglang",
    "integrations",
    "megatron",
]
